apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: mlflow
    secureJsonData:
      password: mlflow
    database: mlflow
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    isDefault: false
    version: 1
    editable: true
