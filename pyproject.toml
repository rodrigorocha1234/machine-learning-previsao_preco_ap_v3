[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imobiliaria-ml"
version = "3.0.0"
description = "Solução de Machine Learning para previsão de preços de imóveis com Spec Driven Development"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rodrigo Rocha" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "scikit-posthocs>=0.7.0",
    "mlflow>=2.10.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "statsmodels>=0.14.0",
    "pytest>=7.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
